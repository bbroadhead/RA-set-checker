name: Import RA catalog and deploy
on:
  workflow_dispatch:
    inputs:
      console_id:
        description: 'Console ID (blank imports all missing consoles sequentially)'
        required: false
        type: string
      refresh:
        description: 'Refresh existing console data'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ra-catalog
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch catalog
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          CONSOLE_ID: ${{ inputs.console_id }}
          REFRESH: ${{ inputs.refresh }}
        run: python3 scripts/import.py
      - name: Commit catalog
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d data ]; then
            git add data
            if ! git diff --cached --quiet; then
              git commit -m 'Update RA catalog'
            fi
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            echo 'Unable to push catalog after five attempts'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html app.js _site/
          cp -r data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: import
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
