<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RA Set Checker</title><style>
*{box-sizing:border-box}body{margin:0;background:#14171c;color:#eee;font:16px system-ui}main{max-width:1200px;margin:auto;padding:22px}h1{margin:0;color:#ffd27a}button,input,select{font:inherit;color:inherit;background:#252b34;border:1px solid #46505e;border-radius:8px;padding:10px}button{cursor:pointer}button[aria-selected=true]{background:#ffd27a;color:#171717}nav,.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}nav{flex-wrap:nowrap;overflow:auto}nav button{white-space:nowrap}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #333}td img{width:48px;height:48px;object-fit:contain;border-radius:6px}a{color:#ffd27a}code{overflow-wrap:anywhere;font-size:12px}details{max-width:420px}input[type=checkbox]{width:24px;height:24px;accent-color:#e9b65b}#status{color:#bac4d1} .scroll{overflow:auto}progress{width:100%;accent-color:#e9b65b} #dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}#dashboard button{text-align:left}details label{display:flex;align-items:center;gap:6px;margin:5px 0} .new{color:#ffd27a}</style><main><h1>RA Set Checker</h1><p>Track your compatible ROM collection.</p><section id="dashboard"></section><nav id="tabs" aria-label="Consoles"></nav><div class="tools"><input id="search" placeholder="Search name or hash" aria-label="Search"><select id="filter" aria-label="Collection filter"><option value="new">New sets</option><option value="all">All games</option><option value="owned">Owned</option><option value="missing">Missing</option></select><button id="neo">Import NeoStation</button><button id="missing">Export missing</button><input hidden type="file" id="neoFile" accept=".json"><button id="export">Export progress</button><button id="import">Import progress</button><input hidden type="file" id="file" accept=".json"></div><p id="status" role="status">Loading console data…</p><progress id="progress" value="0" max="1"></progress><div class="scroll"><table><thead><tr><th>Icon</th><th>Game</th><th>Achievements</th><th>Supported hashes</th><th>Owned</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="app.js"></script></html>
