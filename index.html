<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RA Set Checker</title><style>
*{box-sizing:border-box}body{margin:0;background:#14171c;color:#eee;font:16px system-ui}main{max-width:1200px;margin:auto;padding:22px}h1{margin:0;color:#ffd27a}button,input,select{font:inherit;color:inherit;background:#252b34;border:1px solid #46505e;border-radius:8px;padding:10px}button{cursor:pointer}button[aria-selected=true]{background:#ffd27a;color:#171717}nav,.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}nav{flex-wrap:nowrap;overflow:auto}nav button{white-space:nowrap}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #333}td img{width:48px;height:48px;object-fit:contain;border-radius:6px}a{color:#ffd27a}code{overflow-wrap:anywhere;font-size:12px}details{max-width:420px}input[type=checkbox]{width:24px;height:24px;accent-color:#e9b65b}#status{color:#bac4d1} .scroll{overflow:auto}progress{width:100%;accent-color:#e9b65b}</style><main><h1>RA Set Checker</h1><p>Track your compatible ROM collection.</p><nav id="tabs" aria-label="Consoles"></nav><div class="tools"><input id="search" placeholder="Search name or hash" aria-label="Search"><select id="filter" aria-label="Collection filter"><option value="all">All games</option><option value="owned">Owned</option><option value="missing">Missing</option></select><button id="export">Export progress</button><button id="import">Import progress</button><input hidden type="file" id="file" accept=".json"></div><p id="status" role="status">Loading console data…</p><progress id="progress" value="0" max="1"></progress><div class="scroll"><table><thead><tr><th>Icon</th><th>Game</th><th>Achievements</th><th>Supported hashes</th><th>Owned</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const $=id=>document.getElementById(id), key='ra-set-checker-v1';let owned={},systems=[],games=[],active=null,request=0;try{owned=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}function save(){try{localStorage.setItem(key,JSON.stringify(owned))}catch{$('status').textContent='Unable to save locally; export your progress.'}}function node(tag,value){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const count=games.filter(g=>owned[g.ID]===true).length;$('progress').max=games.length||1;$('progress').value=count;$('status').textContent=count+' owned · '+(games.length-count)+' missing · '+games.length+' total';const frag=document.createDocumentFragment();for(const g of games){if(f==='owned'&&!owned[g.ID]||f==='missing'&&owned[g.ID])continue;if(q&&!g.Title.toLowerCase().includes(q)&&!g.Hashes.some(h=>h.toLowerCase().includes(q)))continue;const tr=node('tr'),icon=node('img');icon.loading='lazy';icon.alt='';icon.src='https://media.retroachievements.org'+g.ImageIcon;const link=node('a',g.Title);link.href='https://retroachievements.org/game/'+g.ID;link.target='_blank';link.rel='noopener';const d=node('details');d.append(node('summary',g.Hashes.length+' hashes'));for(const h of g.Hashes){const c=node('code',h);d.append(c,node('br'))}const cb=node('input');cb.type='checkbox';cb.checked=owned[g.ID]===true;cb.setAttribute('aria-label','Own '+g.Title);cb.onchange=()=>{owned[g.ID]=cb.checked;render();save()};for(const v of [icon,link,node('span',g.NumAchievements),d,cb]){const td=node('td');td.append(v);tr.append(td)}frag.append(tr)}$('rows').replaceChildren(frag)}async function select(s){const token=++request;active=s.ID;for(const b of $('tabs').children)b.setAttribute('aria-selected',String(+b.dataset.id===active));$('rows').replaceChildren();games=[];$('status').textContent='Loading '+s.Name+'…';try{const r=await fetch('data/'+s.ID+'.json');if(!r.ok)throw Error();const data=await r.json();if(token!==request)return;games=data.sort((a,b)=>a.Title.localeCompare(b.Title));render()}catch{if(token===request)$('status').textContent='This console has not been imported yet.'}}$('search').oninput=$('filter').onchange=render;$('export').onclick=()=>{const a=node('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(owned)],{type:'application/json'}));a.download='ra-collection.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const data=JSON.parse(await $('file').files[0].text());if(!data||Array.isArray(data)||typeof data!=='object'||Object.entries(data).some(([k,v])=>!/^\d+$/.test(k)||typeof v!=='boolean'))throw Error();owned={...owned,...data};render();save()}catch{alert('Invalid collection backup')}finally{$('file').value=''}};fetch('data/consoles.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{systems=data.sort((a,b)=>a.Name.localeCompare(b.Name));for(const s of systems){const b=node('button',s.Name);b.dataset.id=s.ID;b.onclick=()=>select(s);$('tabs').append(b)}if(systems.length)select(systems[0]);else $('status').textContent='No consoles found.'}).catch(()=>$('status').textContent='Waiting for initial RetroAchievements data import.');</script></html>
